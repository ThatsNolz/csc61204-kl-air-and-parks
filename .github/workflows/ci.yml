name: Maven verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean verify
      - run: java -jar target/kl-air-and-parks-1.0.0.jar --version
      - uses: actions/upload-artifact@v4
        with:
          name: build-and-test-evidence
          path: |
            target/kl-air-and-parks-1.0.0.jar
            target/surefire-reports/
            target/site/jacoco/

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A707A"/></marker><marker id="headRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A1262F"/></marker><marker id="headTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00796B"/></marker></defs><rect width="1200" height="860" fill="white"/><rect x="470" y="16" width="320" height="50" rx="25" fill="#E6F2F0" stroke="#5A707A" stroke-width="1.2"/><text x="630.0" y="31.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">Resident or caregiver</text><text x="630.0" y="49.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">selects area, refreshes, reports, sets threshold</text><rect x="150" y="90" width="1030" height="150" rx="10" fill="#F2F5F7" stroke="#00796B" stroke-width="1.2"/><rect x="20" y="90" width="120" height="150" rx="10" fill="#00796B"/><text x="80" y="161.0" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">View</text><text x="80" y="178.0" font-size="10.5" font-weight="normal" font-style="normal" fill="#E3F2EF" text-anchor="middle">Swing EDT</text><rect x="150" y="270" width="1030" height="110" rx="10" fill="#F2F5F7" stroke="#00796B" stroke-width="1.2"/><rect x="20" y="270" width="120" height="110" rx="10" fill="#00796B"/><text x="80" y="321.0" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">Controller</text><text x="80" y="338.0" font-size="10.5" font-weight="normal" font-style="normal" fill="#E3F2EF" text-anchor="middle">EDT → worker</text><rect x="150" y="410" width="1030" height="150" rx="10" fill="#F2F5F7" stroke="#00796B" stroke-width="1.2"/><rect x="20" y="410" width="120" height="150" rx="10" fill="#00796B"/><text x="80" y="481.0" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">Service</text><text x="80" y="498.0" font-size="10.5" font-weight="normal" font-style="normal" fill="#E3F2EF" text-anchor="middle">worker thread</text><rect x="150" y="590" width="1030" height="130" rx="10" fill="#F2F5F7" stroke="#00796B" stroke-width="1.2"/><rect x="20" y="590" width="120" height="130" rx="10" fill="#00796B"/><text x="80" y="651.0" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">API and data</text><text x="80" y="668.0" font-size="10.5" font-weight="normal" font-style="normal" fill="#E3F2EF" text-anchor="middle">worker thread</text><rect x="180" y="108" width="300" height="58" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="2"/><text x="330.0" y="119.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">MonitorPanel</text><text x="330.0" y="137.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">shell · implements View · binds actions</text><text x="330.0" y="153.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">owns the TopBar and StatusBar</text><rect x="500" y="108" width="380" height="58" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="1.2"/><text x="690.0" y="119.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">Seven screen panes</text><text x="690.0" y="137.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">Overview · Monitoring · Planner · Reports</text><text x="690.0" y="153.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">Alerts · Data &amp; impact · Settings</text><rect x="900" y="108" width="250" height="58" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="1.2"/><text x="1025.0" y="127.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">ViewPreferences</text><text x="1025.0" y="145.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">district, audience, alerts, threshold</text><rect x="180" y="176" width="970" height="46" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="1.2"/><text x="665.0" y="204.0" font-size="13" font-weight="normal" font-style="normal" fill="#14303B" text-anchor="middle">view.design tokens · view.component controls · view.chart plots · CategoryPalette (EPA colours) · NavigationRailUI</text><rect x="180" y="290" width="430" height="70" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="2"/><text x="395.0" y="307.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">MonitorController</text><text x="395.0" y="325.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">schedules I/O on one worker; AtomicBoolean guards</text><text x="395.0" y="341.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">stop overlapping refreshes and duplicate saves</text><rect x="640" y="290" width="250" height="70" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="1.2"/><text x="765.0" y="315.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">AlertBridge  «ConcreteObserver»</text><text x="765.0" y="333.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">forwards alerts to the EDT</text><rect x="920" y="290" width="230" height="70" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="1.2"/><text x="1035.0" y="307.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">View  «interface»</text><text x="1035.0" y="325.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">output contract; MonitorPanel</text><text x="1035.0" y="341.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">and test fakes implement it</text><rect x="180" y="430" width="430" height="70" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="2"/><text x="395.0" y="447.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">ReadingService</text><text x="395.0" y="465.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">chooses LIVE, CACHED or UNAVAILABLE; publishes live</text><text x="395.0" y="481.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">readings to AlertMonitor; caches validated ones</text><rect x="640" y="430" width="250" height="70" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="1.2"/><text x="765.0" y="447.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">AlertMonitor  «Subject»</text><text x="765.0" y="465.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">fresh upward crossing of</text><text x="765.0" y="481.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">a configurable threshold</text><rect x="920" y="430" width="230" height="70" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="1.2"/><text x="1035.0" y="447.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">AdviceProfile → AdviceStrategy</text><text x="1035.0" y="465.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">«Strategy»: General public,</text><text x="1035.0" y="481.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">Children, Older adults</text><rect x="180" y="512" width="970" height="34" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="1.2"/><text x="665.0" y="534.0" font-size="13" font-weight="normal" font-style="normal" fill="#14303B" text-anchor="middle">Result record: state + validated Reading (or none) + user-safe message</text><rect x="180" y="610" width="430" height="90" rx="6" fill="#FFFFFF" stroke="#5A707A" stroke-width="2"/><text x="395.0" y="629.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">AirQualityGateway  «interface»</text><text x="395.0" y="647.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">OpenMeteoClient: java.net.http.HttpClient,</text><text x="395.0" y="663.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">10 s timeout, Jackson tree validation,</text><text x="395.0" y="679.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">ApiFailure.Kind for 404 / 429 / 5xx / timeout</text><rect x="640" y="610" width="250" height="90" rx="6" fill="#FFF4E0" stroke="#5A707A" stroke-width="1.2"/><text x="765.0" y="637.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">ReadingCache</text><text x="765.0" y="655.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">one validated reading per area</text><text x="765.0" y="671.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">atomic JSON replace</text><rect x="920" y="610" width="230" height="90" rx="6" fill="#FFF4E0" stroke="#5A707A" stroke-width="1.2"/><text x="1035.0" y="637.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">ReportStore</text><text x="1035.0" y="655.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">reports.json, newest first</text><text x="1035.0" y="671.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">never drops older entries</text><rect x="180" y="760" width="560" height="70" rx="6" fill="#EEF1FB" stroke="#5A707A" stroke-width="1.2"/><text x="460.0" y="777.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">Domain model (immutable records and enums)</text><text x="460.0" y="795.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">Reading · CitizenReport · District · AirCategory · CityCatalog</text><text x="460.0" y="811.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">validation in constructors; no Swing or I/O</text><rect x="800" y="760" width="350" height="70" rx="6" fill="#FFFFFF" stroke="#00796B" stroke-width="2"/><text x="975.0" y="777.0" font-size="13" font-weight="bold" font-style="normal" fill="#14303B" text-anchor="middle">Open-Meteo Air Quality API</text><text x="975.0" y="795.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">Copernicus CAMS Global model</text><text x="975.0" y="811.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="middle">GET /v1/air-quality · HTTPS · JSON</text><line x1="630" y1="64" x2="330" y2="106" stroke="#5A707A" stroke-width="1.6" marker-end="url(#head)"/><text x="470.0" y="89.0" font-size="11" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="end">user input</text><line x1="330" y1="222" x2="330" y2="288" stroke="#5A707A" stroke-width="1.6" marker-end="url(#head)"/><text x="338.0" y="259.0" font-size="11" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="start">action calls</text><line x1="395" y1="360" x2="395" y2="428" stroke="#5A707A" stroke-width="1.6" marker-end="url(#head)"/><text x="403.0" y="398.0" font-size="11" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="start">refresh(area) on worker</text><path d="M580,360 L580,395 L1166,395 L1166,598 L1035,598 L1035,607" fill="none" stroke="#5A707A" stroke-width="1.6" marker-end="url(#head)"/><text x="905" y="390" font-size="11" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="start">save / list reports on worker</text><line x1="330" y1="500" x2="330" y2="608" stroke="#5A707A" stroke-width="1.6" marker-end="url(#head)"/><text x="338.0" y="558.0" font-size="11" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="start">fetch(area)</text><line x1="610" y1="465" x2="638" y2="465" stroke="#5A707A" stroke-width="1.6" marker-end="url(#head)"/><line x1="610" y1="655" x2="638" y2="655" stroke="#5A707A" stroke-width="1.6" marker-end="url(#head)"/><line x1="765" y1="430" x2="765" y2="362" stroke="#A1262F" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#headRed)"/><text x="757" y="420" font-size="11" font-weight="normal" font-style="normal" fill="#A1262F" text-anchor="end">onAlert(alert)</text><line x1="700" y1="290" x2="470" y2="168" stroke="#A1262F" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#headRed)"/><text x="597.0" y="233.0" font-size="11" font-weight="normal" font-style="normal" fill="#A1262F" text-anchor="start">alert(...) via invokeLater</text><line x1="250" y1="288" x2="250" y2="168" stroke="#00796B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#headTeal)"/><text x="258" y="236" font-size="11" font-weight="normal" font-style="normal" fill="#00796B" text-anchor="start">Result → reading(...)</text><text x="258" y="250" font-size="11" font-weight="normal" font-style="normal" fill="#00796B" text-anchor="start">via invokeLater</text><path d="M560,700 L560,736 L1000,736 L1000,758" fill="none" stroke="#00796B" stroke-width="1.6" marker-end="url(#headTeal)"/><text x="780" y="731" font-size="10.5" font-weight="normal" font-style="normal" fill="#00796B" text-anchor="middle">HTTPS GET latitude, longitude, current=us_aqi,pm2_5,pm10,nitrogen_dioxide,ozone</text><path d="M1100,758 L1100,748 L600,748 L600,702" fill="none" stroke="#00796B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#headTeal)"/><text x="1108" y="745" font-size="10" font-weight="normal" font-style="normal" fill="#00796B" text-anchor="start">JSON or</text><text x="1108" y="757" font-size="10" font-weight="normal" font-style="normal" fill="#00796B" text-anchor="start">HTTP error</text><line x1="300" y1="700" x2="300" y2="758" stroke="#5A707A" stroke-width="1.6" marker-end="url(#head)"/><text x="308.0" y="733.0" font-size="11" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="start">maps to Reading</text><text x="1180" y="852" font-size="10.5" font-weight="normal" font-style="normal" fill="#5A707A" text-anchor="end">Solid grey: call or data flow   |   Dashed red: Observer notification   |   Dashed teal: hand-back to the Swing EDT</text></svg>